name: terraform

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  # Runs on GitHub's infrastructure, over the public internet.
  # EXPECTED TO FAIL once public network access is disabled.
  plan-hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Where does the storage hostname point
        run: dig +short ${{ vars.SA_NAME }}.blob.core.windows.net || true

      - name: Terraform plan
        env:
          ARM_OIDC_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ARM_OIDC_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          terraform init
          terraform plan -no-color

  # Runs on the VM inside the VNet, over the private endpoint.
  # Survives the cutover. Authenticates via the attached managed identity,
  # so no OIDC token exchange is involved at all.
  plan-private:
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_MSI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Where does the storage hostname point
        run: dig +short ${{ vars.SA_NAME }}.blob.core.windows.net

      - name: Terraform plan
        run: |
          terraform init
          terraform plan -no-color